# Railway: Root Directory olarak `backend` seçin veya bu dosyayı deploy köküne koyun.
# https://docs.railway.app/guides/prisma

[build]
builder = "NIXPACKS"

[deploy]
# Yalnızca API başlatılır; şema değişikliği açılışta otomatik uygulanmaz (db push / migrate deploy yok).
# Prisma Client build sırasında (postinstall + npm run build) üretilir.
# Destructive seed (prisma/seed.ts) production Railway’de çalıştırılmamalıdır.
# DATABASE_URL: Backend servisinde Postgres’ten Reference ile ekleyin (zorunlu).
startCommand = "node dist/index.js"
